spring.application.name=HackHub
server.port=8081

spring.datasource.url=jdbc:h2:mem:hackhubdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Override with --hackhub.demo.password=... outside local demonstrations.
hackhub.demo.password=demo-password

# Calendar Strategy: in-memory (default) or business-hours (weekdays 09:00-18:00).
hackhub.calendar.strategy=in-memory
